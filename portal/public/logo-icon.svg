<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Main Cyan-Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Electric Violet/Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- TV Antenna / Ambient Accent Dots -->
  <circle cx="216" cy="116" r="14" fill="#38bdf8" opacity="0.9" />
  <circle cx="296" cy="116" r="14" fill="#818cf8" opacity="0.9" />
  <path d="M 216 116 L 246 156 M 296 116 L 266 156" stroke="url(#borderGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Stylized "K" + Screen Icon -->
  <!-- Left Vertical Stem of K (Sleek Capsule) -->
  <rect x="144" y="160" width="52" height="192" rx="26" fill="url(#cyanGrad)" filter="url(#glow)" />
  <rect x="144" y="160" width="52" height="192" rx="26" fill="url(#cyanGrad)" />

  <!-- Upper Diagonal Arm of K (Angles into a play chevron) -->
  <path d="M 212 256 L 314 168 C 326 158 344 164 348 180 C 350 190 344 200 334 208 L 248 280 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  <path d="M 212 256 L 314 168 C 326 158 344 164 348 180 C 350 190 344 200 334 208 L 248 280 Z" fill="url(#accentGrad)" />

  <!-- Lower Diagonal Arm of K (Stream Play Accent) -->
  <path d="M 238 266 L 336 344 C 348 354 346 372 332 380 C 322 386 310 384 300 376 L 202 298 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
  <path d="M 238 266 L 336 344 C 348 354 346 372 332 380 C 322 386 310 384 300 376 L 202 298 Z" fill="url(#cyanGrad)" />

  <!-- Subtle Play Triangle overlay inside right side -->
  <polygon points="352,242 382,256 352,270" fill="#22d3ee" opacity="0.95" />
</svg>