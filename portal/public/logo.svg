<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="tvBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group: Emblem -->
  <g transform="translate(16, 16) scale(0.25)">
    <!-- Squircle Base -->
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#logoBgGrad)" stroke="url(#logoBorder)" stroke-width="12" />
    
    <!-- Antennas -->
    <circle cx="216" cy="116" r="16" fill="#38bdf8" />
    <circle cx="296" cy="116" r="16" fill="#818cf8" />
    <path d="M 216 116 L 246 156 M 296 116 L 266 156" stroke="url(#logoBorder)" stroke-width="8" stroke-linecap="round" />

    <!-- Stem of K -->
    <rect x="144" y="160" width="52" height="192" rx="26" fill="url(#logoCyan)" filter="url(#logoGlow)" />
    <rect x="144" y="160" width="52" height="192" rx="26" fill="url(#logoCyan)" />

    <!-- Upper Arm -->
    <path d="M 212 256 L 314 168 C 326 158 344 164 348 180 C 350 190 344 200 334 208 L 248 280 Z" fill="url(#logoAccent)" filter="url(#logoGlow)" />
    <path d="M 212 256 L 314 168 C 326 158 344 164 348 180 C 350 190 344 200 334 208 L 248 280 Z" fill="url(#logoAccent)" />

    <!-- Lower Arm -->
    <path d="M 238 266 L 336 344 C 348 354 346 372 332 380 C 322 386 310 384 300 376 L 202 298 Z" fill="url(#logoCyan)" filter="url(#logoGlow)" />
    <path d="M 238 266 L 336 344 C 348 354 346 372 332 380 C 322 386 310 384 300 376 L 202 298 Z" fill="url(#logoCyan)" />

    <!-- Play icon -->
    <polygon points="352,242 382,256 352,270" fill="#22d3ee" />
  </g>

  <!-- Typography: KORP -->
  <text x="175" y="104" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="4">
    KORP
  </text>

  <!-- Badge: TV -->
  <rect x="445" y="44" width="130" height="66" rx="18" fill="url(#tvBadgeGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#logoGlow)" />
  <rect x="445" y="44" width="130" height="66" rx="18" fill="url(#tvBadgeGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <text x="510" y="93" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    TV
  </text>
</svg>