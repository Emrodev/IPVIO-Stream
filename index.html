<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>IPVIO Stream</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --card: #ffffff; --accent: #2b6cb0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --fg: #f2f2f4; --card: #1c1d21; --accent: #63a4ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { line-height: 1.5; }
  .code { font-family: ui-monospace, monospace; font-size: 1.1rem; word-break: break-all; padding: 14px; border-radius: 8px; background: var(--bg); user-select: all; }
  button { margin-top: 12px; font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .muted { opacity: 0.75; font-size: 0.9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div id="ok" hidden>
      <h1>Sign-in complete</h1>
      <p>Go back to IPVIO Stream on your TV and paste this text into the phone page:</p>
      <div class="code" id="code"></div>
      <button id="copy" type="button">Copy code</button>
      <p class="muted">The code works once and expires after a few minutes. You can close this page.</p>
    </div>
    <div id="fail" hidden>
      <h1>Sign-in not completed</h1>
      <p>Trakt did not return a code and state. Go back to IPVIO Stream on your TV and start the sign-in again.</p>
    </div>
  </div>
</main>
<script>
(function () {
  // Reads the one-time code and the state from the address. Nothing is stored or sent anywhere.
  var params = new URLSearchParams(location.search || "");
  var hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var code = params.get("code") || hash.get("code");
  var state = params.get("state") || hash.get("state");
  var ok = document.getElementById("ok");
  var fail = document.getElementById("fail");
  var okCode = /^[A-Za-z0-9._~-]{8,512}$/;
  var okState = /^[A-Za-z0-9_-]{8,128}$/;
  if (code && state && okCode.test(code) && okState.test(state)) {
    var text = code + "|" + state;
    document.getElementById("code").textContent = text;
    ok.hidden = false;
    document.getElementById("copy").addEventListener("click", function () {
      var btn = this;
      try { navigator.clipboard.writeText(text); btn.textContent = "Copied"; } catch (e) { btn.textContent = "Select the text"; }
    });
    // Remove the code from the address bar so it is not left in history.
    try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
  } else {
    fail.hidden = false;
  }
})();
</script>
</body>
</html>
